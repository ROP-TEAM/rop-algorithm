syntax = "proto3";
package solver;
option go_package = "github.com/ROP-TEAM/rop-algorithm/solver/grpc/pb";

message Node {
  string          id           = 1;
  double          lat          = 2;
  double          lng          = 3;
  int32           demand       = 4;
  int32           service_time = 5;
  int32           tw_start     = 6;  // minutes from midnight
  int32           tw_end       = 7;  // minutes from midnight
  repeated string tags         = 8;
  string          type         = 9;  // depot | delivery | pickup
  string          pair_id      = 10; // links pickup↔delivery; empty if not a PD pair
  int32           priority     = 11; // 1=low 2=medium 3=high 4=critical 0=unset
  int32           deadline_min = 12; // minutes from planning midnight; 0=no deadline
  int32           linehaul_demand = 13; // delivery load consumed from depot; 0 = derive from demand/type
  int32           backhaul_demand = 14; // pickup load added on route; 0 = derive from demand/type
  bool            must_serve      = 15; // true = should not be dropped unless infeasible
}

message Vehicle {
  string          id           = 1;
  int32           capacity     = 2;
  int32           shift_start  = 3;  // minutes from midnight
  int32           shift_end    = 4;  // minutes from midnight
  int32           break_start  = 5;  // 0 = no break
  int32           break_end    = 6;
  int32           max_tasks    = 7;  // 0 = unlimited
  double          max_distance = 8;  // meters; 0 = unlimited
  repeated string tags         = 9;
  double          fixed_cost   = 10;
  double          cost_per_km  = 11;
  string          type         = 12;
}

message SolveRequest {
  Node             depot              = 1;
  repeated Node    nodes              = 2;
  repeated Vehicle vehicles           = 3;
  repeated double  durations          = 4; // flattened n×n, row-major (minutes)
  repeated double  distances          = 5; // flattened n×n, row-major (meters)
  int32            matrix_size        = 6; // n (depot + nodes)
  int32            time_limit_ms      = 7;
  bool             enable_alns        = 8;
  bool             enable_multi_trip  = 9;
  int32            reload_min         = 10; // minutes; 0 = use server default (30)
  uint32           seed               = 11; // 0 = non-deterministic
  int32            multi_start_count  = 12; // 0 = use server default (2)
  bool             disable_capacity    = 13;
  bool             disable_time_window = 14;
}

message DropReason {
  string node_id = 1;
  string code    = 2;
  string detail  = 3;
}

message RouteStop {
  string node_id     = 1;
  int32  arrival_min = 2; // minutes from midnight
  int32  depart_min  = 3; // minutes from midnight
}

message Route {
  string             vehicle_id     = 1;
  repeated RouteStop stops          = 2;
  double             total_distance = 3; // meters
  int32              total_duration = 4; // minutes
  repeated int32     trip_sizes     = 5; // number of stops per trip (multi-trip vehicles)
  double             total_cost     = 6;
}

message SolveResponse {
  repeated Route  routes     = 1;
  repeated string unassigned = 2;
  double          objective  = 3;
  string          status     = 4; // OK | INFEASIBLE | TIMEOUT
  repeated DropReason drop_reasons = 5;
}

service SolverService {
  rpc Solve(SolveRequest) returns (SolveResponse);
}
