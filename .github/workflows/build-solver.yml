name: Build C++ Solver

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/**'
      - 'solver/proto/**'
  pull_request:
    paths:
      - 'core/**'
      - 'solver/proto/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgrpc++-dev protobuf-compiler-grpc

      - name: Configure
        run: |
          cd core
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd core
          cmake --build build --parallel

      - name: Upload solver binary
        uses: actions/upload-artifact@v4
        with:
          name: solver-linux
          path: core/build/solver
          retention-days: 7
