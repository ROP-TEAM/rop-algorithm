<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVRP Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Init Dialog -->
<div id="init-overlay">
  <div id="init-dialog">
    <h2>New CVRP Graph</h2>
    <div class="form-grid">
      <label for="cfg-grid">Grid size (L)</label>
      <input id="cfg-grid" type="number" value="20" min="5" max="100" />

      <label for="cfg-nodes">Number of nodes</label>
      <input id="cfg-nodes" type="number" value="10" min="1" max="100" />

      <label>Depot position</label>
      <div class="radio-group">
        <label><input type="radio" name="depot" value="center" checked /> Center (0,0)</label>
        <label><input type="radio" name="depot" value="random" /> Random</label>
      </div>

      <label for="cfg-demand-min">Node demand range</label>
      <div class="range-row">
        <input id="cfg-demand-min" type="number" value="1" min="1" max="99" />
        <span>–</span>
        <input id="cfg-demand-max" type="number" value="10" min="1" max="99" title="Maximum demand" />
      </div>

      <label for="cfg-groups">Number of groups (vehicles)</label>
      <input id="cfg-groups" type="number" value="3" min="1" max="8" />

      <label for="cfg-vehicle-cap">Vehicle capacity per group</label>
      <input id="cfg-vehicle-cap" type="number" value="30" min="1" max="9999" />

      <label>Edge generation</label>
      <div class="radio-group">
        <label><input type="radio" name="edges" value="none" checked /> None (draw manually)</label>
        <label><input type="radio" name="edges" value="full" /> Full (all pairs)</label>
        <label><input type="radio" name="edges" value="sparse" /> Sparse (random subset)</label>
      </div>

      <label id="noise-label" class="hidden" for="cfg-noise">Edge noise factor</label>
      <div id="noise-row" class="hidden range-row">
        <input id="cfg-noise" type="range" min="0" max="1" step="0.05" value="0.3" />
        <span id="noise-val">0.30</span>
      </div>

      <label>Node clustering</label>
      <div class="radio-group">
        <label><input type="radio" name="cluster" value="uniform" checked /> Uniform</label>
        <label><input type="radio" name="cluster" value="clustered" /> Clustered</label>
      </div>

      <label for="cfg-seed">Seed (optional)</label>
      <input id="cfg-seed" type="number" placeholder="leave blank for random" />

      <label for="cfg-coords">Show coordinates</label>
      <input id="cfg-coords" type="checkbox" />

      <label for="cfg-autoassign">Auto-assign to groups</label>
      <input id="cfg-autoassign" type="checkbox" />
    </div>
    <div class="dialog-actions">
      <button id="btn-generate">Generate</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <div id="panel">
    <div id="panel-toolbar">
      <button id="btn-new-graph">New Graph</button>
      <button id="btn-add-node">+ Node</button>
      <button id="btn-add-depot">+ Depot</button>
      <button id="btn-export">Export JSON</button>
    </div>
    <div id="panel-body"></div>
  </div>
  <div id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid-pattern" patternUnits="userSpaceOnUse" width="30" height="30">
          <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
        </pattern>
        <!-- arrowhead markers injected by renderer -->
      </defs>
      <rect id="grid-bg" fill="url(#grid-pattern)" />
      <g id="canvas-root">
        <g id="layer-edges"></g>
        <g id="layer-draft"></g>
        <g id="layer-nodes"></g>
      </g>
    </svg>
    <div id="ctx-menu" class="hidden"></div>
  </div>
</div>

<script src="graph.js"></script>
<script src="renderer.js"></script>
<script src="interaction.js"></script>
<script src="ui.js"></script>
</body>
</html>
